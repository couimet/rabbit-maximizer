name: rabbit-maximizer-restacker

# Reusable workflows cannot subscribe to events, so this file keeps the
# pull_request_target trigger and delegates the restack logic to the shared
# workflow in couimet/github-actions.

on:
  pull_request_target:
    types: [edited]

jobs:
  restack:
    permissions:
      pull-requests: write
    uses: couimet/github-actions/.github/workflows/rabbit-maximizer-restacker.yml@main
