# MD013/line-length: disabled — project documentation uses long lines
# (code references, URLs, detailed explanations) that don't benefit
# from hard wrapping at 80 characters.
config:
  MD013: false

# MD033/no-inline-html: disabled for CLAUDE.md only — it uses custom
# XML tags (<rule>, <title>, <do>, <never>, <rationale>, etc.) for
# rule definitions. These are not HTML and the rule fires on every
# element. Everything else should still be checked for inline HTML.
overrides:
  - files: 'CLAUDE.md'
    config:
      MD033: false
